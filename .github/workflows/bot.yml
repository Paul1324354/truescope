name: Recherche-Bot

# Ruft regelmäßig alle Länder ab, damit TrueScope schon gefüllt ist, bevor jemand die Seite öffnet.
# Kostet nichts (öffentliches Repo). Die KI-Arbeit läuft im kostenlosen Kontingent von Cloudflare.
on:
  schedule:
    - cron: "*/5 * * * *"    # alle 5 Minuten (GitHub startet geplante Läufe oft einige Minuten verspätet)
  workflow_dispatch: {}

# Nie zwei Läufe gleichzeitig: ein neuer wartet, bis der vorige fertig ist
concurrency:
  group: recherche-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Alle Länder abarbeiten
        run: |
          # Nur die wichtigsten Länder automatisch; alle anderen werden aufgefüllt, sobald jemand sie auswählt.
          for c in AT DE CH EU; do
            echo "== $c"
            curl -sS --max-time 120 "https://truescope-49p.pages.dev/api/news?country=$c&bot=1" | head -c 400 || true
            echo
            sleep 3
          done
