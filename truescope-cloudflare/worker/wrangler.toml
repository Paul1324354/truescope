# TrueScope backend Worker: Cron pipeline + read-only public API.
# `npm run setup` fills in database_id automatically.
name = "truescope-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "truescope"
database_id = "fcea0853-95b7-41a7-9591-dee2a2631342"
migrations_dir = "migrations"

# Once per minute; every run does ONE small step to stay within 10 ms CPU (free plan).
[triggers]
crons = ["* * * * *"]

# Optional, free (10,000 Neurons/day). Only used if AI_SUMMARIES = "true".
[ai]
binding = "AI"

[vars]
ADMIN_EMAIL = ""                 # the account registered with this e-mail becomes admin
AI_SUMMARIES = "false"           # "true" = phrase summaries with Workers AI (still rule-based verification)
AI_DAILY_CALLS = "100"           # ~55 Neurons per call -> well below the free 10,000/day
MAX_FEEDS_PER_RUN = "2"
MAX_ANALYZE_PER_RUN = "4"
MAX_NEW_ARTICLES_PER_DAY = "1500"
DAILY_WRITE_BUDGET = "70000"     # D1 free limit is 100,000 rows written/day
DAILY_READ_BUDGET = "4000000"    # D1 free limit is 5,000,000 rows read/day
RETENTION_DAYS = "30"

[observability]
enabled = true
